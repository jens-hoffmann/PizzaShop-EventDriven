openapi: 3.1.0
info:
  title: Pizza Shop Orders API
  version: 1.0.0
  description: Customer orders, cancellation, completion and status tracking.
servers:
  - url: http://localhost:8082
tags:
  - name: Orders
  - name: Admin Orders
paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
          description: Client-generated key. Replaying the same key returns the original order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '200':
          description: Idempotent replay of an existing order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{id}/history:
    get:
      tags: [Orders]
      operationId: getOrderHistory
      summary: Get order status history
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderStatusHistoryEntry'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled or already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/orders/{id}/complete:
    post:
      tags: [Admin Orders]
      operationId: completeOrder
      summary: Mark a ready order as completed
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Invalid state transition or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Pizza unavailable or invalid order content
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Catalog service unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PizzaSize:
      type: string
      enum: [SMALL, MEDIUM, LARGE]
    OrderStatus:
      type: string
      enum: [PLACED, PAID, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED, PAYMENT_FAILED]
    DeliveryAddress:
      type: object
      required: [street, city, postalCode]
      properties:
        street:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
    OrderItemRequest:
      type: object
      required: [pizzaId, size, quantity]
      properties:
        pizzaId:
          type: string
          format: uuid
        size:
          $ref: '#/components/schemas/PizzaSize'
        quantity:
          type: integer
          minimum: 1
          maximum: 20
    CreateOrderRequest:
      type: object
      required: [customerId, items, deliveryAddress]
      properties:
        customerId:
          type: string
          minLength: 1
          maxLength: 100
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
    OrderItemResponse:
      type: object
      required: [pizzaId, name, size, unitPrice, quantity, lineTotal]
      properties:
        pizzaId:
          type: string
          format: uuid
        name:
          type: string
        size:
          $ref: '#/components/schemas/PizzaSize'
        unitPrice:
          type: number
          format: double
        quantity:
          type: integer
        lineTotal:
          type: number
          format: double
    OrderResponse:
      type: object
      required: [id, customerId, status, items, total, currency, deliveryAddress, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        total:
          type: number
          format: double
        currency:
          type: string
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    OrderStatusHistoryEntry:
      type: object
      required: [status, occurredAt]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
        occurredAt:
          type: string
          format: date-time
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: string
