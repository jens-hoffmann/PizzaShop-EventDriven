name: pizzashop

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pizzashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizzashop}
      POSTGRES_DB: ${POSTGRES_DB:-pizzashop}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka:
    image: docker.io/apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: docker.io/apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic catalog.events.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic kitchen.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.events.v1.DLT --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.events.v1.DLT --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic kitchen.events.v1.DLT --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic catalog.events.v1.DLT --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: docker.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
    restart: unless-stopped

  swagger-ui:
    image: docker.io/swaggerapi/swagger-ui:v5.34.1
    ports:
      - "${SWAGGER_UI_PORT:-8091}:8080"
    volumes:
      - ./openapi:/usr/share/nginx/html/specs:ro,Z
    environment:
      URLS: '[{"url":"/specs/catalog.yaml","name":"Catalog"},{"url":"/specs/orders.yaml","name":"Orders"},{"url":"/specs/kitchen.yaml","name":"Kitchen"},{"url":"/specs/payments.yaml","name":"Payments"},{"url":"/specs/notifications.yaml","name":"Notifications"}]'
      URLS_PRIMARY_NAME: Catalog
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: catalog-service
    image: pizzashop/catalog-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${CATALOG_SERVICE_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pizzashop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pizzashop}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: order-service
    image: pizzashop/order-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      catalog-service:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT:-8082}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pizzashop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pizzashop}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_CATALOG_BASE_URL: http://catalog-service:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kitchen-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: kitchen-service
    image: pizzashop/kitchen-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${KITCHEN_SERVICE_PORT:-8083}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kitchen_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pizzashop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pizzashop}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KITCHEN_ACCEPT_DELAY_MS: ${KITCHEN_ACCEPT_DELAY_MS:-1000}
      APP_KITCHEN_PREPARATION_DELAY_MS: ${KITCHEN_PREPARATION_DELAY_MS:-4000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: payment-service
    image: pizzashop/payment-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${PAYMENT_SERVICE_PORT:-8084}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pizzashop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pizzashop}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_PAYMENT_MODE: ${PAYMENT_MODE:-SUCCESS}
      APP_PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
      APP_PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-1500}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SERVICE: notification-service
    image: pizzashop/notification-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pizzashop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pizzashop}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
